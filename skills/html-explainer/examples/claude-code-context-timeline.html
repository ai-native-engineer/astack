<!doctype html>
<!-- Interactive walkthrough example adapted from https://code.claude.com/docs/en/context-window -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Code 내부 동작</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #f1f0ea;
      color: #1a1918;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(1100px, 100%);
    }
    button {
      font: inherit;
    }
    .cw-root {
      --cw-bg: #FAFAF8;
      --cw-text: #1A1918;
      --cw-text-2: #3D3C38;
      --cw-text-3: #5E5D59;
      --cw-text-dim: #6E6C64;
      --cw-text-faint: #8A8880;
      --cw-surface: rgba(0,0,0,0.025);
      --cw-surface-2: rgba(0,0,0,0.04);
      --cw-border: rgba(0,0,0,0.08);
      --cw-track: rgba(0,0,0,0.04);
      --cw-hover: rgba(0,0,0,0.04);
      --cw-rail: rgba(0,0,0,0.08);
      --cw-scrollbar: rgba(0,0,0,0.22);
      background: var(--cw-bg);
      border-radius: 12px;
      overflow: hidden;
      color: var(--cw-text);
      border: 1px solid var(--cw-border);
    }
    .dark .cw-root {
      --cw-bg: #111110;
      --cw-text: #E8E6DC;
      --cw-text-2: #B8B6AE;
      --cw-text-3: #9C9A92;
      --cw-text-dim: #8A8880;
      --cw-text-faint: #6E6C64;
      --cw-surface: rgba(255,255,255,0.02);
      --cw-surface-2: rgba(255,255,255,0.015);
      --cw-border: rgba(255,255,255,0.06);
      --cw-track: rgba(255,255,255,0.03);
      --cw-hover: rgba(255,255,255,0.04);
      --cw-rail: rgba(255,255,255,0.04);
      --cw-scrollbar: rgba(255,255,255,0.18);
    }
    .cw-root.is-fullscreen {
      height: 100vh;
      border-radius: 0;
      display: flex;
      flex-direction: column;
    }
    .cw-scroll::-webkit-scrollbar { width: 6px; }
    .cw-scroll::-webkit-scrollbar-track { background: transparent; }
    .cw-scroll::-webkit-scrollbar-thumb { background: var(--cw-scrollbar); border-radius: 3px; }
    .cw-header {
      padding: 16px 20px 12px;
      display: flex;
      align-items: flex-end;
      gap: 24px;
    }
    .cw-title-wrap {
      flex: 1 1 0;
      min-width: 0;
    }
    .cw-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
      line-height: 1;
    }
    .cw-subtitle {
      font-size: 14px;
      color: var(--cw-text-dim);
      margin-top: 4px;
    }
    .cw-token-readout {
      text-align: right;
      flex-shrink: 0;
    }
    .cw-mono {
      font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
    }
    .cw-total {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .cw-total span {
      font-size: 15px;
      font-weight: 500;
      margin-left: 4px;
    }
    .cw-cap {
      font-size: 13px;
      color: var(--cw-text-dim);
      margin-top: 2px;
    }
    .cw-bars {
      padding: 0 20px;
    }
    .cw-fill-track {
      height: 4px;
      border-radius: 2px;
      background: var(--cw-track);
      overflow: hidden;
      margin-bottom: 6px;
    }
    .cw-fill {
      height: 100%;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
    }
    .cw-blockbar {
      height: 28px;
      border-radius: 5px;
      background: var(--cw-track);
      border: 1px solid var(--cw-border);
      overflow: hidden;
      display: flex;
    }
    .cw-block {
      height: 100%;
      border: 0;
      padding: 0;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .cw-legend-row {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    .cw-legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .cw-legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .cw-dot-square {
      width: 6px;
      height: 6px;
      border-radius: 1.5px;
    }
    .cw-legend-item span,
    .cw-terminal-note {
      font-size: 12px;
      color: var(--cw-text-dim);
    }
    .cw-terminal-note {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .cw-main {
      display: flex;
      padding: 14px 20px 0;
      gap: 16px;
      height: 420px;
    }
    .cw-root.is-fullscreen .cw-main {
      height: calc(100vh - 240px);
    }
    .cw-timeline {
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      padding-right: 8px;
      scroll-behavior: smooth;
    }
    .cw-empty {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .cw-prompt-line {
      font-size: 16px;
      color: var(--cw-text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cw-cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: var(--cw-text-dim);
      opacity: 0.5;
      animation: cw-blink 1s step-end infinite;
    }
    .cw-start {
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid rgba(217,119,87,0.3);
      background: rgba(217,119,87,0.08);
      color: #D97757;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cw-empty-copy {
      font-size: 13px;
      color: var(--cw-text-faint);
      max-width: 280px;
      text-align: center;
      line-height: 1.5;
    }
    .cw-phase {
      font-size: 12px;
      font-weight: 700;
      color: var(--cw-text-faint);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
      padding-left: 28px;
    }
    .cw-phase.spaced {
      margin-top: 14px;
    }
    .cw-event {
      display: flex;
      align-items: flex-start;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s, opacity 0.15s;
    }
    .cw-event.selected {
      outline: 1px solid rgba(217,119,87,0.4);
    }
    .cw-event-main {
      flex: 1 1 0;
      min-width: 0;
      padding: 5px 10px 5px 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cw-rail-wrap {
      width: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 8px;
      flex-shrink: 0;
    }
    .cw-node {
      border-radius: 50%;
      transition: opacity 0.15s;
    }
    .cw-rail {
      width: 1.5px;
      flex: 1 1 auto;
      background: var(--cw-rail);
      margin-top: 2px;
      min-height: 6px;
    }
    .cw-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .cw-label {
      font-size: 15px;
      flex: 1 1 0;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cw-token-small {
      font-size: 12px;
      color: var(--cw-text-faint);
      flex-shrink: 0;
    }
    .cw-tinybar {
      width: 50px;
      height: 5px;
      border-radius: 2px;
      background: var(--cw-track);
      flex-shrink: 0;
      overflow: hidden;
    }
    .cw-eye-cell {
      width: 14px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
    }
    .cw-sub-start {
      margin-left: 28px;
      margin-top: 6px;
      margin-bottom: 2px;
      padding-left: 10px;
      border-left: 2px solid rgba(155,123,196,0.4);
      font-size: 12px;
      font-weight: 600;
      color: #9B7BC4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .cw-sub-end {
      margin-left: 28px;
      margin-bottom: 6px;
      padding-left: 10px;
      padding-bottom: 6px;
      border-left: 2px solid rgba(155,123,196,0.4);
      font-size: 12px;
      color: var(--cw-text-dim);
    }
    .cw-compacted-row {
      animation: cw-fadein 0.3s ease-out backwards;
    }
    .cw-compact-card,
    .cw-gate-card,
    .cw-prompt-card {
      border-radius: 6px;
    }
    .cw-compact-card {
      margin-bottom: 10px;
      padding: 10px 12px;
      background: rgba(217,119,87,0.05);
      border: 1px solid rgba(217,119,87,0.15);
    }
    .cw-gate-wrap {
      padding-left: 28px;
      margin-top: 12px;
      padding-right: 8px;
    }
    .cw-gate-label {
      font-size: 11px;
      font-weight: 600;
      color: #6BA656;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      padding-left: 2px;
    }
    .cw-prompt-card {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(85,138,66,0.06);
      border: 1px solid rgba(85,138,66,0.2);
    }
    .cw-run-card {
      padding: 12px 14px;
      border-radius: 6px;
      background: rgba(217,119,87,0.06);
      border: 1px solid rgba(217,119,87,0.25);
    }
    .cw-send {
      padding: 5px 12px;
      border-radius: 5px;
      border: 0;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .cw-detail-col {
      width: 300px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .cw-detail {
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--cw-surface);
      border: 1px solid var(--cw-border);
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cw-detail-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .cw-detail-title span {
      font-size: 16px;
      font-weight: 600;
    }
    .cw-detail-chip {
      display: flex;
      width: fit-content;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .cw-detail p {
      font-size: 15px;
      color: var(--cw-text-3);
      line-height: 1.55;
      margin: 0;
    }
    .cw-code {
      font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 0.92em;
      background: var(--cw-track);
      padding: 1px 4px;
      border-radius: 3px;
    }
    .cw-box {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.4;
    }
    .cw-side-card {
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(217,119,87,0.05);
      border: 1px solid rgba(217,119,87,0.12);
    }
    .cw-side-card.neutral {
      background: var(--cw-surface-2);
      border-color: var(--cw-border);
    }
    .cw-side-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }
    .cw-side-text {
      font-size: 13px;
      color: var(--cw-text-3);
      line-height: 1.5;
    }
    .cw-detail-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 4px;
      padding: 12px 0 4px;
    }
    .cw-controls {
      padding: 10px 20px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cw-play {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      border: 0;
      background: rgba(217,119,87,0.1);
      color: #D97757;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cw-progress {
      flex: 1 1 0;
      height: 3px;
      border-radius: 2px;
      background: var(--cw-track);
      overflow: hidden;
    }
    .cw-progress div {
      height: 100%;
      background: #D97757;
      transition: width 0.1s linear;
    }
    .cw-percent {
      font-size: 12px;
      color: var(--cw-text-faint);
      min-width: 30px;
    }
    .cw-fullscreen {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--cw-border);
      background: var(--cw-surface);
      color: var(--cw-text-dim);
      cursor: pointer;
      font-size: 15px;
      flex-shrink: 0;
      margin-left: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cw-mobile-fallback {
      display: none;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 14px;
      border: 1px solid rgba(0,0,0,0.1);
      background: rgba(0,0,0,0.03);
    }
    .dark .cw-mobile-fallback {
      border-color: rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.04);
    }
    @keyframes cw-blink { 50% { opacity: 0; } }
    @keyframes cw-fadein {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 700px) {
      body { display: block; padding: 16px; }
      .cw-root { display: none !important; }
      .cw-mobile-fallback { display: block; }
    }
  </style>
</head>

  <script>
    const MAX = 200000;

    const EVENTS = [
      {"t":0.015,"kind":"auto","label":"시스템 프롬프트","tokens":4200,"color":"#6B6964","vis":"hidden","desc":"Claude가 어떻게 말하고, 어떤 도구를 어떻게 써야 하는지 정한 기본 지시입니다. 세션 시작 때 항상 먼저 들어오지만 터미널에는 보이지 않습니다.","link":null},
      {"t":0.035,"kind":"auto","label":"자동 메모리 (MEMORY.md)","tokens":680,"color":"#E8A45C","vis":"hidden","desc":"이전 작업에서 Claude가 기억해 둔 내용입니다. 자주 쓰는 빌드 명령, 프로젝트 패턴, 다시 하면 안 되는 실수 같은 메모가 들어옵니다. 앞쪽 200줄 또는 25KB 중 작은 범위가 컨텍스트에 들어갑니다.","link":"/en/memory#auto-memory"},
      {"t":0.06,"kind":"auto","label":"실행 환경 정보","tokens":280,"color":"#6B6964","vis":"hidden","desc":"현재 작업 폴더, 운영체제, 셸, git 저장소 여부 같은 정보입니다. 브랜치, 상태, 최근 커밋 정보도 시스템 프롬프트 끝부분에 별도 블록으로 들어갑니다.","link":null},
      {"t":0.08,"kind":"auto","label":"MCP 도구 목록 (지연 로드)","tokens":120,"color":"#9B7BC4","vis":"hidden","desc":"Claude가 어떤 MCP 도구를 쓸 수 있는지 이름만 먼저 봅니다. 기본값에서는 전체 스키마를 다 넣지 않고, 필요한 작업이 생길 때 도구 검색으로 해당 도구만 불러옵니다. `ENABLE_TOOL_SEARCH=auto`는 컨텍스트의 10% 안에 들어갈 때 스키마를 미리 넣고, `ENABLE_TOOL_SEARCH=false`는 전부 미리 넣습니다.","link":"/en/mcp#scale-with-mcp-tool-search"},
      {"t":0.1,"kind":"auto","label":"스킬 설명 목록","tokens":450,"color":"#D4A843","vis":"hidden","noSurviveCompact":true,"desc":"Claude가 스스로 호출할 수 있는 스킬의 한 줄 설명입니다. 스킬 본문은 실제로 그 스킬을 쓸 때만 들어옵니다. `disable-model-invocation: true`인 스킬은 이 목록에도 안 들어오고, 사용자가 `/이름`으로 직접 부를 때까지 컨텍스트를 전혀 쓰지 않습니다. 이 목록은 `/compact` 뒤에 다시 주입되지 않습니다. 실제로 호출한 스킬만 보존됩니다.","link":"/en/skills"},
      {"t":0.12,"kind":"auto","label":"~/.claude/CLAUDE.md","tokens":320,"color":"#6A9BCC","vis":"hidden","desc":"사용자 전역 선호입니다. 어떤 프로젝트에서든 새 세션을 시작하면 프로젝트 지침과 함께 로드됩니다.","link":"/en/memory#choose-where-to-put-claude-md-files"},
      {"t":0.14,"kind":"auto","label":"프로젝트 CLAUDE.md","tokens":1800,"color":"#6A9BCC","vis":"hidden","desc":"프로젝트 규칙, 빌드 명령, 구조 메모가 들어 있는 파일입니다. 팀 전체가 같은 작업 규칙을 공유하게 만드는 가장 중요한 파일입니다.","tip":"200줄 이하로 짧게 유지하세요. 긴 참고 자료는 스킬이나 경로 기반 규칙으로 빼서 필요할 때만 로드되게 두는 편이 좋습니다.","link":"/en/memory"},
      {"t":0.22,"kind":"user","label":"사용자 프롬프트","tokens":45,"color":"#558A42","vis":"full","desc":"\"로그인 후 새로고침하면 401이 뜨는데 원인 찾아서 고쳐줘\"","link":null},
      {"t":0.28,"kind":"claude","label":"src/app/api/auth/route.ts 읽기","tokens":2400,"color":"#8A8880","vis":"brief","desc":"인증 API 파일입니다. 터미널에는 \"route.ts 읽음\" 정도로 보이지만, 실제 2,400토큰 분량의 파일 내용은 Claude 컨텍스트 안에 들어갑니다.","tip":"파일 읽기가 컨텍스트를 가장 많이 씁니다. \"로그인 버그 고쳐줘\"보다 \"auth route에서 401 나는 부분을 봐줘\"처럼 대상을 좁히면 Claude가 덜 헤맵니다. 조사량이 큰 작업은 서브에이전트에 맡기면 좋습니다.","link":null},
      {"t":0.32,"kind":"claude","label":"src/lib/session.ts 읽기","tokens":1100,"color":"#8A8880","vis":"brief","desc":"import를 따라 세션 처리 모듈을 읽습니다. 터미널에는 한 줄 작업 로그로만 보입니다.","link":null},
      {"t":0.35,"kind":"auto","label":"규칙: api-conventions.md","tokens":380,"color":"#4A9B8E","vis":"brief","desc":"`.claude/rules/` 안의 이 규칙은 `src/app/api/**` 경로에 매칭됩니다. Claude가 해당 경로의 파일을 읽는 순간 자동으로 로드됩니다. 터미널에는 \"규칙 로드됨\" 정도만 보이고, 규칙 본문은 보이지 않습니다.","link":"/en/memory#path-specific-rules"},

    const state = {

    const app = document.getElementById("cwApp");
    const fmt = n => n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "K" : n + "";
    const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
    const linkHref = href => href && href.startsWith("/en/") ? DOC_BASE + href : href;
    function setScrollTopNow(el, top) {
      const previousBehavior = el.style.scrollBehavior;
      el.style.scrollBehavior = "auto";
      el.scrollTop = top;
      el.style.scrollBehavior = previousBehavior;
    }
    const esc = value => String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
    const withCode = value => esc(value).split("`").map((part, i) => {
      return i % 2 ? `<code class="cw-code">${part}</code>` : part;
    }).join("");

    function activeGate() {
      return GATES.find((g, i) => i >= state.gatesPassed && state.time >= g.at && state.time < g.resumeTo) || null;
    }

    function model() {
      const gate = activeGate();
      const visibleCount = EVENTS.filter(e => e.t <= state.time).length;
      const preCompactVisible = EVENTS.slice(0, visibleCount);
      const compactGateIdx = GATES.length - 1;
      const isCompacted = state.gatesPassed > compactGateIdx && preCompactVisible.some(e => e.kind === "compact");
      let visible = preCompactVisible;
      let preCompactTotal = 0;

      if (isCompacted) {
        const nonCompact = preCompactVisible.filter(e => e.kind !== "compact");
        const autoLoads = nonCompact.filter(e => e.kind === "auto" && e.t < STARTUP_END && !e.noSurviveCompact);
        const summarized = nonCompact.filter(e => e.t >= STARTUP_END && e.kind !== "sub");
        const sumTokens = summarized.reduce((s, e) => s + e.tokens, 0);
        const summaryBlock = {
          t: STARTUP_END,
          kind: "compact",
          label: "대화 요약",
          tokens: Math.round(sumTokens * 0.12),
          color: "#A09E96",
          vis: "hidden",
          desc: `이전 대화 이벤트 ${summarized.length}개를 하나의 구조화된 요약으로 줄입니다. 요약에는 사용자의 요청과 의도, 핵심 개념, 읽거나 수정한 파일과 중요한 코드 조각, 발생한 에러와 해결 방법, 남은 작업, 현재 작업 상태가 남습니다. 원문 대화는 사라지므로 전체 도구 출력과 중간 추론은 없어집니다. Claude는 작업 맥락은 이어갈 수 있지만, 아까 읽었던 코드 전체를 그대로 갖고 있지는 않습니다.`,
          link: "/en/how-claude-code-works#the-context-window"
        };
        visible = [...autoLoads, summaryBlock];
        preCompactTotal = nonCompact.reduce((s, e) => s + e.tokens, 0);
      }

      const blocks = visible.map((e, visIdx) => ({ ...e, id: e.label + e.t, visIdx }))
        .filter(e => e.tokens > 0 || e.label === "대화 요약");
      const totalTokens = blocks.reduce((s, b) => s + b.tokens, 0);
      const subTotal = visible.filter(e => e.kind === "sub").reduce((s, e) => s + (e.subTokens || 0), 0);
      const pct = totalTokens / MAX * 100;
      const barColor = pct > 75 ? "#D97757" : pct > 50 ? "#B8860B" : "#558A42";
      const activeIdx = state.selIdx !== null ? state.selIdx : state.hovIdx;
      const hovEvent = activeIdx !== null ? visible[activeIdx] || null : null;
      const focusT = hovEvent ? hovEvent.t : state.time;
      const takeaway = isCompacted ? "압축은 대화 원문을 구조화된 요약으로 바꿉니다. 시스템 프롬프트, CLAUDE.md, 메모리, MCP 도구는 다시 로드됩니다. 예외는 스킬 설명 목록입니다. 실제로 호출한 스킬만 보존됩니다."
        : focusT < STARTUP_END ? "사용자가 첫 프롬프트를 치기 전에도 꽤 많은 내용이 이미 들어옵니다. CLAUDE.md, 메모리, 스킬 설명, MCP 도구 목록이 먼저 컨텍스트를 차지합니다."
        : focusT < 0.28 ? "사용자 프롬프트 자체는 이미 로드된 프로젝트 맥락에 비하면 아주 작습니다. Claude의 컨텍스트 대부분은 사용자의 한 문장이 아니라 프로젝트 지식입니다."
        : focusT < 0.50 ? "Claude가 파일을 읽을 때마다 컨텍스트가 늘어납니다. 경로 기반 규칙은 매칭되는 파일과 함께 자동으로 들어옵니다."
        : focusT < 0.71 ? "훅은 도구 이벤트 뒤에 자동 실행됩니다. Claude에게 전달할 출력은 additionalContext JSON으로 들어갑니다. exit code 2의 stderr는 Claude에게 보이지만, exit 0의 일반 stdout은 디버그 로그에만 남습니다."
        : focusT < 0.79 ? "후속 질문은 같은 컨텍스트 위에 계속 쌓입니다. 앞에서 읽은 파일과 대화가 아직 남아 있습니다."
        : focusT < 0.87 ? "서브에이전트는 자기만의 별도 컨텍스트 창에서 일합니다. 파일 읽기 결과는 메인 컨텍스트를 차지하지 않고, 마지막 요약만 돌아옵니다."
        : focusT < 0.88 ? "`!` 명령은 사용자의 셸에서 실행되고, 출력은 다음 메시지에 붙어 컨텍스트로 들어갑니다. Claude에게 직접 실행시키지 않고도 현재 상태를 공유할 때 좋습니다."
        : focusT < 0.90 ? "사용자 전용 스킬은 직접 호출하기 전까지 컨텍스트에 들어오지 않습니다. 시작 시 스킬 목록에는 Claude가 스스로 호출할 수 있는 스킬만 들어갑니다."
        : "/compact는 핵심 정보만 남기고 대화를 요약해 공간을 비웁니다. 실제 작업에서는 컨텍스트가 답변 품질을 흔들기 시작하거나, 긴 새 작업에 들어가기 전에 쓰면 좋습니다.";
      const terminalView = isCompacted ? "\"대화가 압축되었습니다\" 메시지만 보입니다. 요약 생성 과정은 조용히 진행됩니다."
        : focusT < STARTUP_END ? "첫 메시지를 기다리는 입력창만 보입니다. 위의 내용은 사용자가 치기 전에 조용히 로드됩니다."
        : focusT < 0.28 ? "사용자가 입력한 프롬프트가 보입니다. Claude는 아직 본격적으로 작업을 시작하지 않았습니다."
        : focusT < 0.52 ? "사용자 프롬프트와 \"파일 읽는 중\" 같은 로그가 보입니다. 규칙은 본문이 아니라 \"로드됨\" 한 줄 알림으로만 보입니다."
        : focusT < 0.72 ? "Claude의 답변과 파일 변경 내용이 보입니다. 훅은 조용히 실행됩니다. pnpm test 같은 도구 출력은 전체가 아니라 짧은 요약처럼 보입니다."
        : focusT < 0.79 ? "사용자의 추가 요청이 보입니다."
        : focusT < 0.86 ? "서브에이전트가 작업 중이라는 짧은 알림과 최종 결과만 보입니다. 서브에이전트가 어떤 파일을 하나씩 읽었는지는 보이지 않습니다."
        : focusT < 0.90 ? "Claude의 답변, 사용자의 git status 출력, commit-push 스킬 실행 로그가 보입니다."
        : "전체 대화가 남아 있습니다. 필요하면 /compact를 실행할 수 있습니다.";

      return { gate, visible, blocks, totalTokens, subTotal, pct, barColor, activeIdx, hovEvent, takeaway, terminalView, isCompacted, preCompactTotal };
    }

    function publishState(m) {
      window.__contextWindowState = { ...state, activeGate: m.gate, totalTokens: m.totalTokens, visibleCount: m.visible.length, isCompacted: m.isCompacted };
    }

    function structureKey(m) {
      return `${m.visible.length}|${m.blocks.length}|${m.totalTokens}|${!!m.gate}|${m.isCompacted}`;
    }

    function syncLiveUi(m = model()) {
      publishState(m);
      const progressFill = document.querySelector(".cw-progress div");
      const percent = document.querySelector(".cw-percent");
      if (progressFill) progressFill.style.width = `${state.time * 100}%`;
      if (percent) percent.textContent = `${Math.round(state.time * 100)}%`;
    }

    function renderBars(m) {
      return m.blocks.map((b, i) => {
        const w = Math.max(b.tokens / MAX * 100, 0.15);
        const isHov = b.visIdx === m.activeIdx;
        const catMatch = state.hovCat && b.color === state.hovCat;
        const dimmed = state.hovCat ? !catMatch : m.activeIdx !== null && !isHov;
        const opacity = isHov || catMatch ? 1 : dimmed ? 0.25 : 0.65;
        const border = i < m.blocks.length - 1 ? "0.5px solid var(--cw-border)" : "none";
        return `<button class="cw-block" data-event-idx="${b.visIdx}" aria-label="${esc(b.label)}" style="width:${w}%;background:${b.color};opacity:${opacity};border-right:${border}"></button>`;
      }).join("");
    }

    function renderLegend() {
      return LEGEND.map(x => {
        const active = state.hovCat === x.c;
        return `<div class="cw-legend-item" data-cat="${esc(x.c)}" style="background:${active ? "var(--cw-hover)" : "transparent"}">
          <div class="cw-dot-square" style="background:${x.c};opacity:${active ? 1 : 0.7}"></div>
          <span style="color:${active ? "var(--cw-text)" : "var(--cw-text-dim)"}">${esc(x.l)}</span>
        </div>`;
      }).join("");
    }

    function renderEmpty() {
      return `<div class="cw-empty">
        <div class="cw-prompt-line cw-mono"><span style="color:var(--cw-text-faint)">$</span><span>claude</span><span class="cw-cursor"></span></div>
        <button class="cw-start" data-action="start"><span>▶</span><span>세션 시작</span></button>
        <div class="cw-empty-copy"><code class="cw-mono">claude</code>를 실행한 순간부터, 대화가 진행되며 무엇이 컨텍스트에 들어오는지 확인해 보세요.</div>
      </div>`;
    }

    function eyeIcon(vis) {
      if (vis === "hidden") return "";
      const stroke = vis === "full" ? "#558A42" : "currentColor";
      const opacity = vis === "full" ? 1 : 0.5;
      return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="${stroke}" style="color:var(--cw-text-faint);opacity:${opacity}" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    }

    function renderTimeline(m) {
      if (m.visible.length === 0 && !state.playing) return renderEmpty();
      let html = "";
      if (m.isCompacted) {
        html += `<div class="cw-compact-card">
          <div style="font-size:13px;font-weight:600;color:#D97757;margin-bottom:3px">/compact 이후</div>
          <div class="cw-mono" style="font-size:13px;color:var(--cw-text-3);line-height:1.5">${fmt(m.preCompactTotal)} → ${fmt(m.totalTokens)} 토큰 · ${fmt(m.preCompactTotal - m.totalTokens)} 절약</div>
          <div style="font-size:13px;color:var(--cw-text-dim);line-height:1.5;margin-top:4px">컨텍스트에 남은 내용입니다. 메시지 이력 바깥에 있던 시작 정보는 다시 로드되고, 전체 대화는 구조화된 요약 하나로 바뀝니다. 스킬 설명 목록은 다시 로드되지 않습니다.</div>
        </div>`;
      }
      if (state.time > 0 && m.visible.length > 0) {
        html += `<div class="cw-phase">${m.isCompacted ? "압축 후 다시 로드됨" : "사용자가 입력하기 전"}</div>`;
      }
      html += m.visible.map((evt, i) => renderEvent(evt, i, m)).join("");
      if (m.gate && ["prompt", "bang", "slash"].includes(m.gate.kind)) html += renderInputGate(m.gate);
      if (m.gate && m.gate.kind === "compact") html += renderCompactGate(m.gate, m);
      return html;
    }

    function renderEvent(evt, i, m) {
      const meta = KIND_META[evt.kind];
      const isHov = state.hovIdx === i;
      const selected = state.selIdx === i;
      const prevKind = i > 0 ? m.visible[i - 1].kind : null;
      const isSub = evt.kind === "sub";
      const enteringSubagent = isSub && prevKind !== "sub";
      const leavingSubagent = prevKind === "sub" && !isSub;
      let showPhase = null;
      if (evt.kind === "user" && prevKind !== "user") showPhase = "사용자";
      else if (evt.kind === "claude" && prevKind === "user") showPhase = "Claude 작업";
      else if (evt.label === "대화 요약") showPhase = "/compact로 요약됨";
      const isNewRow = m.isCompacted && !(evt.kind === "auto" && evt.t < STARTUP_END);
      const rowOpacity = state.hovCat && evt.color !== state.hovCat ? 0.35 : 1;
      const nodeSize = evt.kind === "user" || evt.kind === "compact" ? 10 : 7;
      const labelColor = isHov ? "var(--cw-text)" : evt.kind === "user" ? "#558A42" : evt.kind === "auto" ? "var(--cw-text-dim)" : "var(--cw-text-2)";
      let html = `<div class="${isNewRow ? "cw-compacted-row" : ""}" style="${isNewRow ? `animation-delay:${i * 60}ms` : ""}">`;
      if (showPhase) html += `<div class="cw-phase spaced">${esc(showPhase)}</div>`;
      if (enteringSubagent) html += `<div class="cw-sub-start">서브에이전트의 별도 컨텍스트 창</div>`;
      if (leavingSubagent) html += `<div class="cw-sub-end cw-mono">↓ ${fmt(m.subTotal)} 토큰은 서브에이전트 컨텍스트에만 남음 · 메인에는 요약만 반환</div>`;
      html += `<div class="cw-event ${selected ? "selected" : ""}" data-event-idx="${i}" style="
        background:${selected || isHov ? "var(--cw-hover)" : "transparent"};
        opacity:${rowOpacity};
        margin-left:${isSub ? 28 : 0}px;
        padding-left:${isSub ? 10 : 0}px;
        border-left:${isSub ? "2px solid rgba(155,123,196,0.4)" : "none"}">
        <div class="cw-rail-wrap">
          <div class="cw-node" style="width:${nodeSize}px;height:${nodeSize}px;background:${evt.color};opacity:${isHov ? 1 : 0.6};box-shadow:${isHov ? `0 0 8px ${evt.color}40` : "none"}"></div>
          ${i < m.visible.length - 1 ? '<div class="cw-rail"></div>' : ""}
        </div>
        <div class="cw-event-main">
          <span class="cw-badge cw-mono" style="background:${meta.badgeBg};color:${meta.badgeColor}">${esc(meta.badge)}</span>
          <span class="cw-label cw-mono" style="color:${labelColor};font-weight:${evt.kind === "user" ? 550 : 400}">${esc(evt.label)}</span>
          ${evt.tokens > 0 ? `<span class="cw-token-small cw-mono">+${fmt(evt.tokens)}</span>` : ""}
          ${evt.subTokens > 0 ? `<span class="cw-token-small cw-mono" style="color:#9B7BC4;opacity:0.6">+${fmt(evt.subTokens)}</span>` : ""}
          ${evt.tokens > 0 ? `<div class="cw-tinybar"><div style="width:${Math.min(evt.tokens / 5000 * 100, 100)}%;height:100%;background:${evt.color};opacity:${isHov ? 0.8 : 0.4};transition:opacity 0.15s"></div></div>` : ""}
          <span class="cw-eye-cell" title="${esc(VIS_META[evt.vis].label)}">${eyeIcon(evt.vis)}</span>
        </div>
      </div></div>`;
      return html;
    }

    function renderInputGate(gate) {
      return `<div class="cw-gate-wrap">
        <div class="cw-gate-label cw-mono">터미널에 이렇게 입력</div>
        <div class="cw-prompt-card">
          <span class="cw-mono" style="color:#558A42;font-size:15px;flex-shrink:0">❯</span>
          <span class="cw-mono" style="font-size:15px;color:var(--cw-text-2);flex:1;line-height:1.5">${esc(gate.text)}<span class="cw-cursor" style="width:7px;height:13px;margin-left:2px;background:#558A42;vertical-align:middle"></span></span>
          <button class="cw-send" data-action="send-gate" style="background:#558A42">${gate.kind === "prompt" ? "보내기 ↵" : "실행 ↵"}</button>
        </div>
      </div>`;
    }

    function renderCompactGate(gate, m) {
      return `<div class="cw-gate-wrap">
        <div class="cw-run-card">
          <div style="font-size:13px;color:var(--cw-text-3);margin-bottom:8px;line-height:1.5">현재 컨텍스트는 <span class="cw-mono" style="font-weight:600;color:${m.barColor}">${fmt(m.totalTokens)} 토큰</span>입니다. <code class="cw-code">/compact</code>를 실행하면 이전 대화를 요약하고 다음 작업을 위한 공간을 확보합니다.</div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="cw-mono" style="color:#D97757;font-size:15px">❯</span>
            <span class="cw-mono" style="font-size:15px;color:var(--cw-text-2);flex:1">${esc(gate.text)}</span>
            <button class="cw-send" data-action="send-gate" style="background:#D97757">실행 ↵</button>
          </div>
        </div>
      </div>`;
    }

    function renderDetail(m) {
      const evt = m.hovEvent;
      const head = evt ? `<div>
        <div class="cw-detail-title"><div style="width:10px;height:10px;border-radius:3px;background:${evt.color};opacity:0.8"></div><span>${esc(evt.label)}</span></div>
        <div class="cw-detail-chip" style="background:${KIND_META[evt.kind].badgeBg}"><span style="font-size:12px;font-weight:600;color:${KIND_META[evt.kind].badgeColor}">${esc(KIND_META[evt.kind].detail)}</span></div>
        ${evt.tokens > 0 ? `<div class="cw-mono" style="font-size:14px;color:var(--cw-text-dim);margin-bottom:6px">${fmt(evt.tokens)} 토큰</div>` : ""}
        ${evt.subTokens > 0 ? `<div class="cw-mono" style="font-size:14px;color:#9B7BC4;margin-bottom:6px">서브에이전트 컨텍스트 ${fmt(evt.subTokens)} 토큰</div>` : ""}
        <p>${withCode(evt.desc)}</p>
        <div class="cw-box" style="margin-top:10px;background:${evt.vis === "full" ? "rgba(85,138,66,0.08)" : "var(--cw-surface-2)"};border:1px solid ${evt.vis === "full" ? "rgba(85,138,66,0.2)" : "var(--cw-border)"}">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px"><span style="font-size:13px;color:${evt.vis === "full" ? "#558A42" : "var(--cw-text-dim)"}">${evt.vis === "full" ? "●" : evt.vis === "brief" ? "◐" : "○"}</span><span style="font-size:12px;font-weight:600;color:var(--cw-text-2)">${esc(VIS_META[evt.vis].label)}</span></div>
          <div style="font-size:13px;color:var(--cw-text-dim);line-height:1.4">${esc(VIS_META[evt.vis].sub)}</div>
        </div>
        ${evt.tip ? `<div class="cw-box" style="margin-top:10px;background:rgba(85,138,66,0.06);border:1px solid rgba(85,138,66,0.15)"><div style="font-size:12px;font-weight:600;color:#558A42;margin-bottom:3px;display:flex;align-items:center;gap:4px"><span>💡</span> 컨텍스트 아끼기</div><div style="font-size:13px;color:var(--cw-text-3);line-height:1.5">${withCode(evt.tip)}</div></div>` : ""}
        ${evt.link ? `<a href="${esc(linkHref(evt.link))}" style="display:inline-block;margin-top:10px;font-size:13px;color:#D97757;text-decoration:none;border-bottom:1px solid rgba(217,119,87,0.3)">자세히 보기 →</a>` : ""}
      </div>` : `<div class="cw-detail-empty">
        <div style="font-size:22px;opacity:0.2">👁</div>
        <div style="font-size:14px;font-weight:500;color:var(--cw-text-dim)">이벤트에 마우스를 올리거나 클릭</div>
        <div style="font-size:12px;color:var(--cw-text-faint);line-height:1.4;max-width:200px">마우스를 올리면 미리 보고, 클릭하면 고정해서 스크롤하며 볼 수 있습니다.</div>
      </div>`;
      return `${head}
        <div class="cw-side-card">
          <div class="cw-side-label" style="color:#D97757">핵심 포인트</div>
          <div class="cw-side-text">${esc(m.takeaway)}</div>
        </div>
        <div class="cw-side-card neutral">
          <div class="cw-side-label" style="color:var(--cw-text-dim)">터미널에서 보이는 것</div>
          <div class="cw-side-text">${esc(m.terminalView)}</div>
        </div>`;
    }

    function render() {
      const m = model();
      const previousTimelineScrollTop = document.getElementById("cwTimeline")?.scrollTop ?? 0;
      const previousDetailScrollTop = document.getElementById("cwDetail")?.scrollTop ?? 0;
      const timelineScrollKey = `${m.visible.length}|${!!m.gate}|${m.isCompacted}`;
      const shouldAutoScrollTimeline = timelineScrollKey !== lastTimelineScrollKey;
      lastTimelineScrollKey = timelineScrollKey;
      const detailKey = m.hovEvent ? `${m.hovEvent.label}|${m.hovEvent.t}` : "";
      const shouldResetDetailScroll = detailKey !== lastDetailKey;
      lastDetailKey = detailKey;
      const playLabel = state.time >= 1 ? "처음부터 다시" : m.gate ? "계속" : state.playing ? "일시정지" : "재생";
      publishState(m);
      app.innerHTML = `<div class="cw-mobile-fallback">이 인터랙티브 타임라인은 큰 화면에서 가장 잘 보입니다. 같은 개념은 <a href="https://code.claude.com/docs/en/context-window#what-the-timeline-shows" style="color:#D97757">공식 문서 설명</a>에서도 볼 수 있습니다.</div>
        <section id="cwRoot" class="cw-root ${state.isFullscreen ? "is-fullscreen" : ""}" aria-label="Claude Code 내부 동작">
          <div class="cw-header">
            <div class="cw-title-wrap"><div class="cw-title">Claude Code 내부 동작</div><div class="cw-subtitle">세션 중 무엇이 컨텍스트에 들어가고 얼마나 쓰는지 보는 시뮬레이션</div></div>
            <div class="cw-token-readout"><div class="cw-total cw-mono" style="color:${m.barColor}">~${fmt(m.totalTokens)}<span>토큰</span></div><div class="cw-cap cw-mono" title="토큰 수는 예시입니다. 실제 값은 CLAUDE.md 크기, MCP 서버, 파일 길이에 따라 달라집니다.">/ ${fmt(MAX)} · 예시</div></div>
          </div>
          <div class="cw-bars">
            <div class="cw-fill-track"><div class="cw-fill" style="width:${m.pct}%;background:${m.barColor}"></div></div>
            <div class="cw-blockbar">${renderBars(m)}</div>
            <div class="cw-legend-row">
              <div class="cw-legend">${renderLegend()}</div>
              <div class="cw-terminal-note"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#558A42" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg><span>= 터미널에 보이는 내용</span></div>
            </div>
          </div>
          <div class="cw-main">
            <div id="cwTimeline" class="cw-timeline cw-scroll">${renderTimeline(m)}</div>
            <div class="cw-detail-col"><div id="cwDetail" class="cw-detail cw-scroll">${renderDetail(m)}</div></div>
          </div>
          <div class="cw-controls">
            <button class="cw-play" data-action="play" aria-label="${playLabel}">${state.time >= 1 ? "↺" : state.playing ? "⏸" : "▶"}</button>
            <div class="cw-progress"><div style="width:${state.time * 100}%"></div></div>
            <span class="cw-percent cw-mono">${Math.round(state.time * 100)}%</span>
            <button class="cw-fullscreen" data-action="fullscreen" aria-label="${state.isFullscreen ? "전체화면 나가기" : "전체화면"}" title="${state.isFullscreen ? "전체화면 나가기" : "전체화면"}">${state.isFullscreen ? "⤡" : "⛶"}</button>
          </div>
        </section>`;
      const timeline = document.getElementById("cwTimeline");
      const detail = document.getElementById("cwDetail");
      if (detail && m.hovEvent && shouldResetDetailScroll && !state.detailManualScroll) setScrollTopNow(detail, 0);
      else if (detail) setScrollTopNow(detail, previousDetailScrollTop);
      if (!timeline) return;
      setScrollTopNow(timeline, previousTimelineScrollTop);
      if (!shouldAutoScrollTimeline || (!state.timelineAutoScroll && !m.isCompacted)) return;
      if (m.isCompacted) timeline.scrollTo({ top: 0, behavior: "smooth" });
      else if (state.timelineAutoScroll && (state.playing || m.gate)) {
        timeline.scrollTo({ top: timeline.scrollHeight, behavior: "smooth" });
      }
    }

    function startPlaying() {
      if (state.playing) return;
      state.playing = true;
      state.lastFrame = null;
      render();
      state.raf = requestAnimationFrame(tick);
    }

    function stopPlaying() {
      state.playing = false;
      state.lastFrame = null;
      if (state.raf) cancelAnimationFrame(state.raf);
      state.raf = null;
      render();
    }

    function reset(play) {
      state.time = 0;
      state.gatesPassed = 0;
      state.selIdx = null;
      state.hovIdx = null;
      state.timelineAutoScroll = true;
      state.detailManualScroll = false;
      if (play) startPlaying();
      else stopPlaying();
    }

    function sendGate() {
      const gate = activeGate();
      if (!gate) return;
      state.gatesPassed += 1;
      state.time = gate.resumeTo;
      state.selIdx = null;
      state.hovIdx = null;
      state.timelineAutoScroll = true;
      state.detailManualScroll = false;
      if (gate.kind === "compact") {
        state.playing = false;
        state.lastFrame = null;
        render();
      } else {
        state.playing = false;
        startPlaying();
      }
    }

    function togglePlay() {
      const gate = activeGate();
      if (state.time >= 1) reset(true);
      else if (gate) sendGate();
      else if (state.playing) stopPlaying();
      else startPlaying();
    }

    function tick(ts) {
      if (!state.playing) {
        state.raf = null;
        return;
      }
      if (state.lastFrame === null) state.lastFrame = ts;
      const dt = clamp((ts - state.lastFrame) / 1000, 0, 0.25);
      state.lastFrame = ts;
      const prev = state.time;
      const beforeKey = structureKey(model());
      let next = prev + dt * 0.032;
      const gate = GATES.find((g, i) => i >= state.gatesPassed && prev < g.at && next >= g.at);
      if (gate) {
        state.time = gate.at;
        state.playing = false;
        state.lastFrame = null;
        state.raf = null;
        render();
        return;
      }
      if (next >= 1) {
        state.time = 1;
        state.playing = false;
        state.lastFrame = null;
        state.raf = null;
        render();
        return;
      }
      state.time = next;
      const nextModel = model();
      if (structureKey(nextModel) === beforeKey) syncLiveUi(nextModel);
      else render();
      state.raf = requestAnimationFrame(tick);
    }

    function markTimelineManualScroll(event) {
      if (event.target.closest("#cwTimeline")) state.timelineAutoScroll = false;
      if (event.target.closest("#cwDetail")) state.detailManualScroll = true;
      syncLiveUi();
    }

    app.addEventListener("click", event => {
      state.hasInteracted = true;
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "start") return startPlaying();
      if (action === "play") return togglePlay();
      if (action === "send-gate") return sendGate();
      if (action === "fullscreen") {
        const root = document.getElementById("cwRoot");
        if (!root) return;
        if (document.fullscreenElement) document.exitFullscreen();
        else root.requestFullscreen().catch(() => {});
        return;
      }
      const eventEl = event.target.closest("[data-event-idx]");
      if (eventEl && app.contains(eventEl)) {
        const idx = Number(eventEl.dataset.eventIdx);
        state.selIdx = state.selIdx === idx ? null : idx;
        state.detailManualScroll = false;
        render();
      }
    });

    app.addEventListener("wheel", markTimelineManualScroll, { passive: true });
    app.addEventListener("touchstart", markTimelineManualScroll, { passive: true });
    app.addEventListener("pointerdown", markTimelineManualScroll);

    app.addEventListener("mouseover", event => {
      const eventEl = event.target.closest("[data-event-idx]");
      if (eventEl && app.contains(eventEl) && !eventEl.contains(event.relatedTarget)) {
        state.hovIdx = Number(eventEl.dataset.eventIdx);
        state.detailManualScroll = false;
        render();
        return;
      }
      const catEl = event.target.closest("[data-cat]");
      if (catEl && app.contains(catEl) && !catEl.contains(event.relatedTarget)) {
        state.hovCat = catEl.dataset.cat;
        render();
      }
    });

    app.addEventListener("mouseout", event => {
      const eventEl = event.target.closest("[data-event-idx]");
      if (eventEl && app.contains(eventEl) && !eventEl.contains(event.relatedTarget)) {
        state.hovIdx = null;
        render();
        return;
      }
      const catEl = event.target.closest("[data-cat]");
      if (catEl && app.contains(catEl) && !catEl.contains(event.relatedTarget)) {
        state.hovCat = null;
        render();
      }
    });

    document.addEventListener("fullscreenchange", () => {
      state.isFullscreen = !!document.fullscreenElement;
      render();
    });

    window.addEventListener("keydown", event => {
      const tag = event.target.tagName;
      if (["INPUT", "BUTTON", "TEXTAREA", "SELECT"].includes(tag) || event.target.isContentEditable) return;
      if (event.code !== "Space") return;
      const root = document.getElementById("cwRoot");
      if (!root || !state.hasInteracted) return;
      const rect = root.getBoundingClientRect();
      if ((rect.width === 0 && rect.height === 0) || rect.bottom < 0 || rect.top > window.innerHeight) return;
      event.preventDefault();
      togglePlay();
    });

    render();
  </script>
</body>
</html>
